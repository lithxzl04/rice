# ~/.config/kitty/kitty.conf

# ── Font ──────────────────────────────────────────────────────────────────────
font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.0

# ── Window ────────────────────────────────────────────────────────────────────
window_padding_width     8
remember_window_size     no
confirm_os_window_close  0

# Slight transparency (works nicely with Hyprland blur). Set to 1.0 to disable.
background_opacity       0.95

# ── Cursor ────────────────────────────────────────────────────────────────────
cursor_shape             block
cursor_blink_interval    0

# ── Scrollback and behavior ───────────────────────────────────────────────────
scrollback_lines         10000
copy_on_select           clipboard
mouse_hide_wait          3.0
enable_audio_bell        no
shell_integration        enabled
url_style                curly

# ── Tabs ──────────────────────────────────────────────────────────────────────
tab_bar_style            powerline
tab_powerline_style      round
tab_bar_min_tabs         2
tab_title_template       " {index} {title[:22]} "

# ── Colors ────────────────────────────────────────────────────────────────────
# Generated by matugen from the wallpaper (template: quickshell/matugen/kitty-colors.conf,
# registered in matugen/config.toml). Missing file = kitty defaults until matugen runs.
include ~/.config/kitty-colors.conf
# Pinned: neutral black instead of matugen's tinted surface (kitty uses the later value).
background #141414

# ── SSH ───────────────────────────────────────────────────────────────────────
# Host-specific binds (IPs, users) live outside the repo; a missing file is ignored.
# Example line for it: map ctrl+shift+alt+s launch --type=tab --title ssh kitten ssh myhost
# (kitty's ssh kitten installs terminfo + shell integration on the remote.)
include ~/.config/kitty-local.conf
